name: CI-Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        configuration: [Release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK using WinGet
        shell: pwsh
        run: |
          if ($env:VULKAN_SDK) {
            Write-Host "VULKAN_SDK already set to $env:VULKAN_SDK"
            "VULKAN_SDK=$env:VULKAN_SDK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $wingetStdOut = Join-Path $env:RUNNER_TEMP "winget-vulkan-install.out.log"
          $wingetStdErr = Join-Path $env:RUNNER_TEMP "winget-vulkan-install.err.log"
          $wingetArgs = @(
            "install",
            "--id", "KhronosGroup.VulkanSDK",
            "--exact",
            "--source", "winget",
            "--accept-source-agreements",
            "--accept-package-agreements",
            "--disable-interactivity"
          )

          $wingetProc = Start-Process -FilePath "winget" -ArgumentList $wingetArgs -NoNewWindow -Wait -PassThru -RedirectStandardOutput $wingetStdOut -RedirectStandardError $wingetStdErr
          if ($wingetProc.ExitCode -ne 0) {
            Write-Error "Vulkan SDK installation failed with exit code $($wingetProc.ExitCode)."
            if (Test-Path $wingetStdErr) {
              Get-Content $wingetStdErr -Tail 100
            }
            exit $wingetProc.ExitCode
          }

          $sdkRoot = "C:/VulkanSDK"
          if (-not (Test-Path $sdkRoot)) {
            Write-Error "Vulkan SDK installation completed but '$sdkRoot' was not found."
            exit 1
          }

          $installed = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $installed) {
            Write-Error "Could not resolve installed Vulkan SDK directory under '$sdkRoot'."
            exit 1
          }

          "VULKAN_SDK=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure Vulkan SDK is available
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK) {
            Write-Error "VULKAN_SDK is not set on this runner. Install Vulkan SDK on the runner or add a setup step before configure."
            exit 1
          }

          Write-Host "Using VULKAN_SDK=$env:VULKAN_SDK"

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build/x64 -G "Visual Studio 18 2026" -A x64 -DUMBRACOMPILER_BUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: cmake --build build/x64 --config ${{ matrix.configuration }} --parallel

  build-ubuntu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config \
            git tar wget xz-utils \
            vulkan-tools mesa-vulkan-drivers \
            libwayland-dev libxkbcommon-dev xorg-dev \
            libasound2-dev libudev-dev zlib1g-dev \
            libfmt-dev libxml2-dev \
            libopenexr-dev libimath-dev \
            libglib2.0-dev

      - name: Install Vulkan SDK (Linux)
        shell: bash
        run: |
          set -eux
          VULKAN_VERSION="1.4.350.0"
          VULKAN_DIR="/opt/vulkan"
          if [ -n "${VULKAN_SDK:-}" ] && [ -d "${VULKAN_SDK}" ]; then
            echo "VULKAN_SDK already set to ${VULKAN_SDK}"
          else
            mkdir -p "${VULKAN_DIR}"
            wget -qO /tmp/vulkan_sdk.tar.xz \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
            tar -xf /tmp/vulkan_sdk.tar.xz -C "${VULKAN_DIR}"
            rm /tmp/vulkan_sdk.tar.xz
            export VULKAN_SDK="${VULKAN_DIR}/${VULKAN_VERSION}/x86_64"
          fi

          echo "VULKAN_SDK=${VULKAN_SDK}" >> "$GITHUB_ENV"
          echo "PATH=${VULKAN_SDK}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${VULKAN_SDK}/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Ensure Vulkan SDK is available
        shell: bash
        run: |
          if [ -z "${VULKAN_SDK:-}" ]; then
            echo "VULKAN_SDK is not set on this runner."
            exit 1
          fi
          echo "Using VULKAN_SDK=${VULKAN_SDK}"

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -G Ninja -DUMBRACOMPILER_BUILD_EXAMPLES=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel
